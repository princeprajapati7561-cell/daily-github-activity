name: Daily Auto Commit

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update file
        run: echo "Updated on $(date)" >> update.txt

      - name: Commit and push
        run: |
          git config user.name "Prince Prajapati"
          git config user.email "princeprajapati7561@gmail.com"
          git add update.txt
          git commit -m "Auto commit: $(date)" || echo "No changes"
          git push
